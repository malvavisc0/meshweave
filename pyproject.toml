[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweave"
version = "0.1.5"
description = "Render pages with Playwright, extract markdown, links, emails, and optionally crawl internal links."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Malvavisc0" }]
keywords = ["markdown", "crawler", "emails", "links"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Text Processing :: Markup",
]

dependencies = [
  "beautifulsoup4",
  "html-to-markdown",
  "lxml",
  "psycopg2-binary",
  "playwright",
  "pydantic",
  "sqlalchemy",
  "pydantic-ai",
  "python-dotenv",
  "langfuse",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
  "mypy",
  "pyinstaller",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "radon",
]

[project.urls]
Homepage = "https://github.com/malvavisc0/meshweave"
Repository = "https://github.com/malvavisc0/meshweave"

[project.scripts]
meshweave = "meshweave.cli:main"

[tool.setuptools.packages.find]
include = ["meshweave*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".cache",
  "data",
  "data/postgres",
  "data/webapp",
  "alembic",
  "alembic/versions",
  "docs",
  "webapp/static",
  "webapp/templates",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["data", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Line length is enforced by the formatter; E501 only flags un-splittable
# long strings, copy text, and docstrings, so we ignore it for linting.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["meshweave", "webapp"]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pre-commit]
default_stages = ["commit"]
