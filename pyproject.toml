[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdownify-crawler"
version = "0.1.0"
description = "Render pages with Playwright, extract markdown, links, emails, and optionally crawl internal links."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = ["markdown", "crawler", "playwright", "fastapi", "emails", "links"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Text Processing :: Markup",
]

dependencies = [
  "beautifulsoup4",
  "html-to-markdown[lxml]",
]

[project.optional-dependencies]
renderer = ["playwright"]
server = ["fastapi[standard]", "uvicorn[standard]"]

[project.urls]
Homepage = "https://example.com/markdownify-crawler"
Repository = "https://example.com/markdownify-crawler"

[project.scripts]
markdownify-crawl = "markdownify_crawler.cli:main_crawl"
markdownify-serve = "markdownify_crawler.cli:main_serve"

[tool.setuptools.packages.find]
include = ["markdownify_crawler*"]
