[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweave"
version = "0.1.0"
description = "Turn websites into words and signals"
requires-python = ">=3.14"
readme = ""
authors = [{ name = "MeshWeave", email = "hello@meshweaveai.com" }]
dependencies = []

[project.optional-dependencies]
runtime = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "jinja2",
  "sqlalchemy",
  "psycopg2-binary",
  "python-multipart",
  "httpx",
  "authlib",
  "cryptography",
  "prometheus-client",
  "alembic",
  "openai",
  "redis",
]

[tool.setuptools]
packages = ["meshweave"]
package-dir = { "meshweave" = "." }

[tool.setuptools.package-data]
meshweave = [
  "templates/*.html",
  "static/*",
  "static/**/*.css",
  "static/**/*.js",
  "static/**/*.map",
  "static/**/*.*",
]

[project.scripts]
meshweave = "webapp.cli:main"
