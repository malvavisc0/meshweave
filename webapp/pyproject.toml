[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweave"
version = "0.1.0"
description = "Turn websites into words and signals"
requires-python = ">=3.9"
readme = ""
authors = [{ name = "MeshWeave", email = "hello@meshweave.com" }]
dependencies = []  # Runtime deps are installed at image level

[tool.setuptools]
packages = ["meshweave"]
package-dir = { "meshweave" = "." }

[tool.setuptools.package-data]
meshweave = [
  "templates/*.html",
  "static/*",
  "static/**/*.css",
  "static/**/*.js",
  "static/**/*.map",
  "static/**/*.*"
]

[project.scripts]
meshweave = "webapp.cli:main"
