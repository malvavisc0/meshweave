{% extends "base.html" %}

{% block content %}
<div class="container">
  <section class="panel mt-4" role="region" aria-label="Server Error">

    <!-- Error Title -->
    <h1 class="error-title">500 — Internal Server Error</h1>

    <!-- Error Message -->
    <p class="error-message">
      Something went wrong on our side. Our team has been notified of this issue.
    </p>

    <!-- Actions -->
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <button class="btn btn-tertiary" onclick="history.back()" type="button">Go Back</button>
    </div>

    <!-- Support Info -->
    <div class="error-support">
      <span>If the problem persists, please contact support with this reference:</span>
      <code class="error-ref">MW-500-{{ range(100000, 999999) | random }}</code>
    </div>

  </section>
</div>
{% endblock %}
