{% extends "base.html" %}

{% block content %}
<div class="container">
<h1>Products</h1>

<section class="panel mt-2" role="region" aria-label="Products">
  <div class="actions" role="toolbar" aria-label="Product Actions">
    <button type="button" class="btn btn-primary" onclick="openProductForm()">New Product</button>
    <a href="/my" class="btn">Back to Dashboard</a>
  </div>

  <div class="table-wrap">
    <table class="table mt-1" aria-label="Products Table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Website</th>
          <th>Updated</th>
          <th>Contact Info</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="products-tbody">
        <tr><td colspan="5"><em class="small">Loading…</em></td></tr>
      </tbody>
    </table>
  </div>

  <!-- Product Form Drawer -->
  <div id="product-form" class="panel mt-2 hidden" aria-hidden="true" aria-label="Product Form">
    <h3 id="pf-title">New Product</h3>
    <div id="pf-global" class="small validation-error" role="status" aria-live="polite"></div>
    <div class="small">Fields marked “required” must be filled.</div>
    <div class="form-grid mt-2">
      <label>Name (required)<br>
        <input type="text" id="pf-name" placeholder="Product Name" aria-describedby="pf-name-err" aria-invalid="false">
        <br><small id="pf-name-err" class="small validation-error"></small>
      </label>
      <label>Website<br>
        <input type="text" id="pf-website" placeholder="https://example.com">
      </label>
      <label>Contact Info<br>
        <input type="text" id="pf-contact" class="w-full" placeholder="Jane Doe <jane@example.com>" pattern="^[^<>\n]+ <[^<>\s@]+@[^<>\s@]+\.[^<>\s@]+>$" title="Format: Name <email@example.com>">
      </label>
      <label class="col-span-all">Description (required)<br>
        <textarea id="pf-description" rows="3" class="w-full" aria-describedby="pf-description-err" aria-invalid="false"></textarea>
        <br><small id="pf-description-err" class="small validation-error"></small>
      </label>
    </div>
    <div class="mt-1" role="toolbar" aria-label="Product Form Actions">
      <button class="btn" onclick="saveProduct()">Save</button>
      <button class="btn" onclick="closeProductForm()">Cancel</button>
    </div>
    <input type="hidden" id="pf-id" value="">
  </div>
</section>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Pass CSRF token to external script (if needed)
  var CSRF_TOKEN = "{{ csrf_token or '' }}";
</script>
<script src="/static/js/products.js"></script>
{% endblock %}
