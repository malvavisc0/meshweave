---
name: meshweave

networks:
  magics:

services:
  postgres:
    image: postgres:18
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meshweave
    volumes:
      # postgres:18+ stores data in version-specific subdirs under
      # /var/lib/postgresql; mounting the parent enables pg_upgrade layout
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d meshweave" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - magics
  alembic:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: meshweave:latest
    container_name: meshweave-alembic
    profiles: [ "migration" ]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/meshweave
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./webapp:/app/webapp
    entrypoint: [ "uv", "run", "alembic" ]
    command: [ "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magics
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    hostname: redis
    restart: always
    expose:
      - 6379
    volumes:
      - ./data/redis:/data
    networks:
      - magics
  lightpanda:
    # Pinned digest of lightpanda/browser:nightly (2026-08-26); bump deliberately
    image: lightpanda/browser:0.3.7
    container_name: lightpanda
    hostname: lightpanda
    restart: always
    command: ["lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222"]
    expose:
      - "9222"
    healthcheck:
      # No curl/wget in the image; use bash's /dev/tcp to probe the CDP port
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9222' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - magics
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: meshweave:latest
    container_name: meshweave
    hostname: meshweave
    restart: always
    environment:
      SITE_BASE_URL: ${SITE_BASE_URL}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/meshweave
      FOOTER_REPO_URL: ${FOOTER_REPO_URL}
      FOOTER_CONTACT_EMAIL: ${FOOTER_CONTACT_EMAIL}
      WEBAPP_AUTO_MIGRATE: true
      MESHWEAVE_CACHE_DIR: /tmp/meshweave/cache
      MESHWEAVE_DISABLE_CACHE: true
      ENABLE_TELEMETRY: false
      RYBBIT_SCRIPT_URL: ${RYBBIT_SCRIPT_URL}
      RYBBIT_SITE_ID: ${RYBBIT_SITE_ID}
      # Render pages through the LightPanda CDP service instead of local Chromium
      MESHWEAVE_CDP_ENDPOINT: http://lightpanda:9222
      # Prefer local source templates/static during local dev so code edits take effect without rebuild
      WEBAPP_PREFER_LOCAL_TEMPLATES: "true"
      WEBAPP_PREFER_LOCAL_STATIC: "true"
      SITE_NAME: MeshWeave
      # Auth config (disabled for local dev — no OAuth credentials needed)
      WEBAPP_AUTH_ENABLED: true
      WEBAPP_READYZ_REQUIRE_AUTH: true
      # Public base URL for redirects. For local dev you can leave it unset or set to http://localhost:8080
      # In production behind HTTPS (Nginx Proxy Manager), set to your https origin, e.g. https://your.domain
      WEBAPP_AUTH_COOKIE_NAME: auth_sid
      # For local dev (no TLS) set false; in production behind HTTPS set true
      WEBAPP_AUTH_COOKIE_SECURE: false
      WEBAPP_AUTH_TTL_SECONDS: 86400
      WEBAPP_AUTH_ABS_MAX_SECONDS: 604800
      AUTH_USER_MAX_SESSIONS: 5
      # Authenticated user quotas and site crawl defaults/caps
      AUTH_USER_DAILY_SITE_CRAWLS: 20
      AUTH_USER_CONCURRENT_JOBS: 2
      AUTH_SITE_MAX_PAGES_DEFAULT: 25
      AUTH_SITE_MAX_DEPTH_DEFAULT: 1
      AUTH_SITE_TIME_BUDGET_MS_DEFAULT: 600000
      AUTH_SITE_MAX_PAGES_CAP: 250
      AUTH_SITE_MAX_DEPTH_CAP: 3
      # Anonymous user quotas (stricter)
      ANON_SITE_MAX_PAGES_DEFAULT: 10
      ANON_SITE_MAX_DEPTH_DEFAULT: 1
      ANON_SITE_MAX_PAGES_CAP: 10
      # OAuth (Google)
      OAUTH_PROVIDER: google
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      # Optional email domain allowlist (comma-separated)
      # OAUTH_ALLOWED_DOMAINS: yourcompany.com
      OAUTH_STATE_TTL: 600
      # Login rate limit
      LOGIN_RATE_LIMIT_MAX: 5
      LOGIN_RATE_LIMIT_WINDOW_SEC: 900
      # CSRF for logout forms
      WEBAPP_CSRF_ENABLED: true
      WEBAPP_CSRF_MAX_AGE: 7200
      # Staged CSP: overrides the built-in default once WEBAPP_ENABLE_CSP=true.
      # Permits Google Fonts/favicons alongside 'self'. If you enable telemetry,
      # add your analytics origin to script-src and connect-src here (the
      # built-in default already derives it from RYBBIT_SCRIPT_URL).
      WEBAPP_CSP: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      # Claim public analyses minimum age (hours)
      CLAIM_PUBLIC_MIN_AGE_HOURS: 24
      # AI integration (llamacpp via OpenAI-compatible endpoint)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      AAX_ENABLED : ${AAX_ENABLED}
      # Opt-in LLM observability (Langfuse); off unless both keys are provided
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DEBUG: yes
      # Database pool tuning (Postgres)
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 1800
      DB_POOL_TIMEOUT: 30
    volumes:
      - ./data/cache:/tmp/meshweave/cache
      # Hot-reload: mount source code into the container
      - ./webapp:/app/webapp
      - ./meshweave:/app/meshweave
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8080:8080"
    # Override CMD for local dev: uvicorn with --reload for hot-reload
    command: [ "uv", "run", "uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload" ]
    depends_on:
      postgres:
        condition: service_healthy
      lightpanda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/readyz" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - magics
