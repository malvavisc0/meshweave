---
name: meshweave

networks:
  magics:

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meshweave
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meshweave"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - magics
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    hostname: redis
    restart: always
    expose:
      - 6379
    volumes:
      - ./data/redis:/data
    networks:
      - magics
  meshweave:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: meshweave:latest
    container_name: meshweave
    hostname: meshweave
    restart: always
    environment:
      SITE_BASE_URL: ${SITE_BASE_URL}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/meshweave
      FOOTER_REPO_URL: ${FOOTER_REPO_URL}
      FOOTER_CONTACT_EMAIL: ${FOOTER_CONTACT_EMAIL}
      WEBAPP_AUTO_MIGRATE: true
      MARKDOWNIFY_CACHE_DIR: /tmp/markdownify/cache
      MARKDOWNIFY_DISABLE_CACHE: true
      # Prefer local source templates/static during local dev so code edits take effect without rebuild
      WEBAPP_PREFER_LOCAL_TEMPLATES: "true"
      WEBAPP_PREFER_LOCAL_STATIC: "true"
      SITE_NAME: Meshweave
      # Auth config
      WEBAPP_AUTH_ENABLED: true
      WEBAPP_READYZ_REQUIRE_AUTH: false
      # Public base URL for redirects. For local dev you can leave it unset or set to http://localhost:8080
      # In production behind HTTPS (Nginx Proxy Manager), set to your https origin, e.g. https://your.domain
      WEBAPP_AUTH_COOKIE_NAME: auth_sid
      # For local dev (no TLS) set false; in production behind HTTPS set true
      WEBAPP_AUTH_COOKIE_SECURE: false
      WEBAPP_AUTH_TTL_SECONDS: 86400
      WEBAPP_AUTH_ABS_MAX_SECONDS: 604800
      AUTH_USER_MAX_SESSIONS: 5
      # Authenticated user quotas and site crawl defaults/caps
      AUTH_USER_DAILY_SITE_CRAWLS: 10
      AUTH_USER_CONCURRENT_JOBS: 3
      AUTH_SITE_MAX_PAGES_DEFAULT: 100
      AUTH_SITE_MAX_DEPTH_DEFAULT: 2
      AUTH_SITE_TIME_BUDGET_MS_DEFAULT: 900000
      AUTH_SITE_MAX_PAGES_CAP: 500
      AUTH_SITE_MAX_DEPTH_CAP: 5
      # OAuth (Google)
      OAUTH_PROVIDER: google
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      # Optional email domain allowlist (comma-separated)
      # OAUTH_ALLOWED_DOMAINS: yourcompany.com
      OAUTH_STATE_TTL: 600
      # Login rate limit
      LOGIN_RATE_LIMIT_MAX: 5
      LOGIN_RATE_LIMIT_WINDOW_SEC: 900
      # CSRF for logout forms
      WEBAPP_CSRF_ENABLED: true
      WEBAPP_CSRF_MAX_AGE: 7200
      # Claim public analyses minimum age (hours)
      CLAIM_PUBLIC_MIN_AGE_HOURS: 24
      # AI integration
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_MODEL_ID: ${AI_MODEL_ID}
      AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379}
      AI_CHAT_VERBOSE_ERRORS: yes
      # Database pool tuning (Postgres)
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 1800
      DB_POOL_TIMEOUT: 30
    volumes:
      - ./.cache:/tmp/markdownify/cache
      - ./data/webapp:/db
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - magics
